<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账本</title>
    <!-- PWA 适配苹果手机桌面图标 -->
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoi5Lqs6LWE5rqQIiwic2hvcnRfbmFtZSI6IuezuuezuuezuuezuS4reWbvSIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjZmZmZmZmIiwidGhlbWVfY29sb3IiOiIjMzQ5OGY2In0=">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
        body{background:#f4f5f7;padding:16px;color:#333}
        .container{max-width:700px;margin:0 auto}
        .card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #00000010}
        .title{font-size:20px;font-weight:bold;margin-bottom:16px;text-align:center}
        .row{margin-bottom:12px}
        label{display:block;margin-bottom:6px;font-size:14px;color:#555}
        input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}
        .btn{width:100%;padding:13px;border:none;border-radius:10px;background:#3498f6;color:#fff;font-size:17px;margin-top:8px}
        .btn-year-chart{background:#27ae60;margin-bottom:10px;}
        .btn-month-chart{background:#e67e22;margin-bottom:10px;}
        .btn-export{background:#9b59b6}
        .btn-import{background:#16a085}
        .bill-item{padding:14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
        .bill-info{flex:1}
        .bill-date{font-size:14px;color:#777}
        .bill-cate{font-weight:bold;margin:2px 0}
        .bill-note{font-size:14px;color:#666}
        .bill-amount{font-size:18px;font-weight:bold}
        .del-btn{background:#ff4d4f;color:white;border:none;padding:6px 10px;border-radius:6px;margin-left:8px}
        .total{font-size:17px;padding:10px;background:#f0f7ff;border-radius:10px;margin-bottom:10px}
        .chart-box{display:none}
        canvas{width:100%!important;height:350px!important;margin-top:10px}
        .filter-row{display:flex;gap:10px}
        .filter-row>div{flex:1}
        .file-input{display:none;}
        .cate-tip{padding:8px 12px;background:#ffeaa7;border-radius:8px;margin-bottom:10px;text-align:center;display:none;}
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="title">📒 记账本</div>
        <div class="row">
            <label>类型</label>
            <select id="type">
                <option value="income">收入</option>
                <option value="expense">支出</option>
            </select>
        </div>
        <div class="row">
            <label>分类</label>
            <select id="category">
                <!-- 动态加载分类 -->
            </select>
        </div>
        <div class="row">
            <label>日期</label>
            <input type="date" id="date">
        </div>
        <div class="row">
            <label>金额</label>
            <input type="number" step="0.01" id="money" placeholder="输入金额">
        </div>
        <div class="row">
            <label>备注</label>
            <input type="text" id="remark" placeholder="备注（选填）">
        </div>
        <button class="btn" onclick="addBill()">✅ 添加账单</button>
    </div>

    <div class="card">
        <div class="title">📊 账单筛选</div>
        <div class="filter-row">
            <div>
                <label>选择年份</label>
                <select id="yearSel" onchange="updateMonthOptions();saveFilter();renderBillList();">
                </select>
            </div>
            <div>
                <label>选择月份</label>
                <select id="monthSel" onchange="saveFilter();renderBillList();">
                </select>
            </div>
        </div>
        <div class="total" id="monthTotal"></div>
    </div>

    <div class="card">
        <button class="btn btn-year-chart" onclick="toggleYearChart()">📈 点击查看/隐藏【年度支出饼图】</button>
        <button class="btn btn-month-chart" onclick="toggleMonthChart()">📊 点击查看/隐藏【当月支出饼图】</button>
        <div class="chart-box" id="chartWrap">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="title">📜 账单列表</div>
        <div class="cate-tip" id="cateTip"></div>
        <div id="billList"></div>
        <button class="btn btn-export" onclick="exportCsv()" style="margin-top:16px;">💾 导出CSV账单</button>
        <button class="btn btn-import" onclick="document.getElementById('fileInput').click()" style="margin-top:10px;">📥 导入CSV备份文件</button>
        <input type="file" id="fileInput" accept=".csv" class="file-input" onchange="importCsv(event)">
    </div>
</div>

<script>
// 收支分类【支出增加学习】
const cateConfig = {
    income: ["工资", "奖金", "爸妈资助", "其他"],
    expense: ["餐饮（吃+喝）", "衣服", "护肤", "日常用品", "医疗", "交通", "娱乐", "转账（家人）", "学习"]
};
let billList = JSON.parse(localStorage.getItem("myBill")) || [];
let pieChartIns = null;
let chartType = ""; //标记当前是年度/当月饼图
let selectedCate = null; //饼图点击选中的分类

// 保存筛选年月到本地
function saveFilter(){
    const y = document.getElementById("yearSel").value;
    const m = document.getElementById("monthSel").value;
    localStorage.setItem("filterYear", y);
    localStorage.setItem("filterMonth", m);
}

// 获取最新账单的年月
function getLatestBillYM(){
    if(billList.length ===0){
        const now = new Date();
        return {y: now.getFullYear(), m: now.getMonth()+1};
    }
    //按日期倒序，取第一条
    const sorted = [...billList].sort((a,b)=>new Date(b.date)-new Date(a.date));
    const latestDate = new Date(sorted[0].date);
    return {
        y: latestDate.getFullYear(),
        m: latestDate.getMonth()+1
    }
}

// 初始化
window.onload = function(){
    initCate();
    initYearSelect();
    document.getElementById('date').valueAsDate = new Date();
    renderBillList();
}

// 切换收入/支出时，分类下拉跟着变
document.getElementById("type").onchange = initCate;
function initCate(){
    const type = document.getElementById("type").value;
    const sel = document.getElementById("category");
    sel.innerHTML = "";
    cateConfig[type].forEach(c=>{
        sel.innerHTML += `<option value="${c}">${c}</option>`
    })
}

// 年份下拉初始化
function initYearSelect(){
    const yearSel = document.getElementById("yearSel");
    const years = new Set();
    const now = new Date();
    years.add(now.getFullYear());
    billList.forEach(b=>{
        const y = new Date(b.date).getFullYear();
        years.add(y);
    })
    const yArr = Array.from(years).sort((a,b)=>b-a);
    yearSel.innerHTML = "";
    yArr.forEach(y=>yearSel.innerHTML += `<option value="${y}">${y}</option>`);

    // 读取上次保存的年月，没有则取最新账单年月
    let targetY = localStorage.getItem("filterYear");
    let targetM = localStorage.getItem("filterMonth");
    const latestYM = getLatestBillYM();

    if(!targetY || !targetM){
        targetY = latestYM.y;
        targetM = latestYM.m;
    }

    // 赋值年份
    yearSel.value = targetY;
    updateMonthOptions();

    // 检查月份是否存在，不存在自动切到最新月份
    const monthSel = document.getElementById("monthSel");
    let monthExist = false;
    for(let opt of monthSel.options){
        if(opt.value == targetM){
            monthExist = true;
            break;
        }
    }
    if(monthExist){
        monthSel.value = targetM;
    }else{
        monthSel.value = latestYM.m;
        saveFilter();
    }
}

// 根据选中年份，更新月份下拉
function updateMonthOptions(){
    const year = document.getElementById("yearSel").value;
    const monthSel = document.getElementById("monthSel");
    const months = new Set();
    billList.filter(b=> new Date(b.date).getFullYear() == year).forEach(b=>{
        const m = new Date(b.date).getMonth()+1;
        months.add(m);
    })
    const mArr = Array.from(months).sort((a,b)=>a-b);
    monthSel.innerHTML = "";
    mArr.forEach(m=>monthSel.innerHTML += `<option value="${m}">${m}月</option>`);
    if(mArr.length===0) monthSel.innerHTML = `<option value="">暂无账单</option>`;
}

// 添加账单
function addBill(){
    const type = document.getElementById("type").value;
    const cate = document.getElementById("category").value;
    const date = document.getElementById("date").value;
    const money = Number(document.getElementById("money").value);
    const remark = document.getElementById("remark").value.trim();
    if(!money || money<=0){alert("请输入正确金额");return;}
    billList.push({type,cate,date,money,remark});
    saveData();
    initYearSelect();
    renderBillList();
    document.getElementById("money").value="";
    document.getElementById("remark").value="";
}

// 保存本地存储
function saveData(){
    localStorage.setItem("myBill",JSON.stringify(billList));
}

// 删除账单
function delBill(idx){
    if(confirm("确定删除这条记录？")){
        billList.splice(idx,1);
        saveData();
        initYearSelect();
        renderBillList();
    }
}

// 渲染账单列表
function renderBillList(){
    const year = Number(document.getElementById("yearSel").value);
    const month = Number(document.getElementById("monthSel").value);
    const listWrap = document.getElementById("billList");
    const tipDom = document.getElementById("cateTip");

    let filterBills = billList.filter(b=>{
        const d = new Date(b.date);
        return d.getFullYear()===year && (month? (d.getMonth()+1===month):true);
    })

    // 如果选中分类，继续过滤
    if(selectedCate){
        filterBills = filterBills.filter(b=>b.cate === selectedCate)
        tipDom.style.display = "block";
        tipDom.innerText = `🔍 当前筛选分类：${selectedCate}，再次点击饼图区块可清除筛选`;
    }else{
        tipDom.style.display = "none";
    }

    filterBills.sort((a,b)=>new Date(b.date)-new Date(a.date));

    let html = "";
    let inTotal = 0, expTotal =0;
    filterBills.forEach((item,idx)=>{
        const realIdx = billList.indexOf(item);
        if(item.type==="income") inTotal += item.money;
        else expTotal += item.money;
        const amountText = item.type==="income" ? `+${item.money.toFixed(2)}` : `-${item.money.toFixed(2)}`;
        const amountColor = item.type==="income" ? "#27ae60":"#e74c3c";
        html += `
        <div class="bill-item">
            <div class="bill-info">
                <div class="bill-date">${item.date} | ${item.cate}</div>
                <div class="bill-note">${item.remark||"无备注"}</div>
            </div>
            <div class="bill-amount" style="color:${amountColor}">${amountText}</div>
            <button class="del-btn" onclick="delBill(${realIdx})">删</button>
        </div>`
    })
    listWrap.innerHTML = html || "<div style='padding:20px;text-align:center;color:#888'>暂无账单</div>";
    document.getElementById("monthTotal").innerText = `✅本月收入：${inTotal.toFixed(2)}元 | ❌本月支出：${expTotal.toFixed(2)}元 | 结余：${(inTotal-expTotal).toFixed(2)}元`
}

// 切换【年度饼图】
function toggleYearChart(){
    const wrap = document.getElementById("chartWrap");
    // 如果当前打开的就是年度饼图，点击关闭
    if(wrap.style.display === "block" && chartType === "year"){
        wrap.style.display = "none";
        return;
    }
    wrap.style.display = "block";
    chartType = "year";
    selectedCate = null; //切换饼图清空分类筛选
    renderBillList();
    drawYearPie();
}

// 切换【当月饼图】
function toggleMonthChart(){
    const wrap = document.getElementById("chartWrap");
    // 如果当前打开的就是当月饼图，点击关闭
    if(wrap.style.display === "block" && chartType === "month"){
        wrap.style.display = "none";
        return;
    }
    wrap.style.display = "block";
    chartType = "month";
    selectedCate = null; //切换饼图清空分类筛选
    renderBillList();
    drawMonthPie();
}

// 绘制【年度支出饼图】
function drawYearPie(){
    const year = Number(document.getElementById("yearSel").value);
    const yearExp = billList.filter(b=>b.type==="expense" && new Date(b.date).getFullYear()===year);
    const group = {};
    yearExp.forEach(b=>{
        if(!group[b.cate]) group[b.cate]=0;
        group[b.cate] += b.money;
    })
    const labels = Object.keys(group);
    const data = Object.values(group);
    if(pieChartIns) pieChartIns.destroy();
    const ctx = document.getElementById("pieChart").getContext('2d');
    pieChartIns = new Chart(ctx,{
        type:"pie",
        data:{
            labels:labels,
            datasets:[{
                data:data,
                backgroundColor:["#e74c3c","#1abc9c","#3498db","#a5d6a7","#f9e79f","#bb8fce","#ffb74d","#95a5a6","#7986cb"]
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            onClick:function(e,elements){
                if(elements.length>0){
                    const idx = elements[0].index;
                    const cateName = labels[idx];
                    // 点击同一分类，取消筛选；不同分类切换筛选
                    if(selectedCate === cateName){
                        selectedCate = null;
                    }else{
                        selectedCate = cateName;
                    }
                    renderBillList();
                }
            },
            plugins:{
                legend:{position:"bottom"},
                title:{display:true,text:`${year}年 全年支出分类`},
                tooltip:{
                    callbacks:{
                        label:function(context){
                            const val = context.raw;
                            const total = context.dataset.data.reduce((a,b)=>a+b,0);
                            const pct = ((val/total)*100).toFixed(1);
                            return `${context.label}: ${val.toFixed(2)}元 (${pct}%)`
                        }
                    }
                },
                datalabels:{
                    enabled:true,
                    color:"#ffffff",
                    font:{size:14,weight:"bold"},
                    anchor:"center",
                    align:"center",
                    formatter:function(value){
                        return value.toFixed(0)+"元";
                    }
                }
            }
        }
    })
}

// 绘制【当月支出饼图】
function drawMonthPie(){
    const year = Number(document.getElementById("yearSel").value);
    const month = Number(document.getElementById("monthSel").value);
    const monthExp = billList.filter(b=>{
        const d = new Date(b.date);
        return b.type==="expense" && d.getFullYear()===year && (d.getMonth()+1 === month);
    });
    const group = {};
    monthExp.forEach(b=>{
        if(!group[b.cate]) group[b.cate]=0;
        group[b.cate] += b.money;
    })
    const labels = Object.keys(group);
    const data = Object.values(group);
    if(pieChartIns) pieChartIns.destroy();
    const ctx = document.getElementById("pieChart").getContext('2d');
    pieChartIns = new Chart(ctx,{
        type:"pie",
        data:{
            labels:labels,
            datasets:[{
                data:data,
                backgroundColor:["#e74c3c","#1abc9c","#3498db","#a5d6a7","#f9e79f","#bb8fce","#ffb74d","#95a5a6","#7986cb"]
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            onClick:function(e,elements){
                if(elements.length>0){
                    const idx = elements[0].index;
                    const cateName = labels[idx];
                    // 点击同一分类，取消筛选；不同分类切换筛选
                    if(selectedCate === cateName){
                        selectedCate = null;
                    }else{
                        selectedCate = cateName;
                    }
                    renderBillList();
                }
            },
            plugins:{
                legend:{position:"bottom"},
                title:{display:true,text:`${year}年${month}月 当月支出分类`},
                tooltip:{
                    callbacks:{
                        label:function(context){
                            const val = context.raw;
                            const total = context.dataset.data.reduce((a,b)=>a+b,0);
                            const pct = ((val/total)*100).toFixed(1);
                            return `${context.label}: ${val.toFixed(2)}元 (${pct}%)`
                        }
                    }
                },
                datalabels:{
                    enabled:true,
                    color:"#ffffff",
                    font:{size:14,weight:"bold"},
                    anchor:"center",
                    align:"center",
                    formatter:function(value){
                        return value.toFixed(0)+"元";
                    }
                }
            }
        }
    })
}

// 导出CSV
function exportCsv(){
    let csv = "日期,类型,分类,金额,备注\n";
    billList.forEach(b=>{
        const typeText = b.type==="income"?"收入":"支出";
        csv += `${b.date},${typeText},${b.cate},${b.money},${b.remark}\n`
    })
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `记账账单_${new Date().toLocaleDateString()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

// CSV导入功能（追加账单，不覆盖原有）
function importCsv(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        const text = e.target.result;
        const lines = text.split("\n");
        const newBills = [];
        for(let i=1;i<lines.length;i++){
            const line = lines[i].trim();
            if(!line) continue;
            const row = line.split(",");
            if(row.length<4) continue;
            const date = row[0];
            const typeText = row[1];
            const cate = row[2];
            const money = parseFloat(row[3]);
            const remark = row[4]||"";
            const type = typeText === "收入" ? "income" : "expense";
            newBills.push({type,cate,date,money,remark});
        }
        if(newBills.length ===0){
            alert("导入失败，文件内没有有效账单！");
            return;
        }
        billList = billList.concat(newBills);
        saveData();
        initYearSelect();
        renderBillList();
        alert(`✅成功导入 ${newBills.length} 条账单！`);
    }
    reader.readAsText(file);
    event.target.value = "";
}
</script>
</body>
</html>
